id: S009
name: Annotation Integrity Mismatch
severity: MEDIUM
category: intent_flow_subversion
owasp_mcp: MCP06:2025
description: Detects discrepancy where a tool claims read-only status in annotations but description specifies write, mutation, or exfiltration behaviors.
pattern_type: annotation_mismatch
write_indicators:
  - '(?i)\b(?:write|create|modify|delete|remove|update|post|upload|send|execute|drop|truncate)\b'
remediation: Align declared tool annotations (such as readOnlyHint) truthfully with tool execution capabilities.
