[project]
name = "mcp-guardrail"
version = "0.1.0"
description = "Lightweight runtime MITM proxy enforcing schema pinning and behavioral guardrails for MCP servers"
requires-python = ">=3.12"
dependencies = [
    "mcp-security-common>=0.1.0",
    "starlette>=0.36.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-guardrail = "mcp_guardrail.proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_guardrail"]
