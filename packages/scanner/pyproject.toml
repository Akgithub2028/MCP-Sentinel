[project]
name = "mcp-scanner"
version = "0.1.0"
description = "Automated static and dynamic security auditor for Model Context Protocol servers"
requires-python = ">=3.12"
dependencies = [
    "mcp-security-common>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-scan = "mcp_scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_scanner"]
