[project]
name = "mcp-security-common"
version = "0.1.0"
description = "Shared types, hashing, rules engine, and reporting for MCP Security Toolkit"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_security_common"]
