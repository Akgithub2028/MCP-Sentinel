name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv pip install --system -r packages/lab/servers/atk1_description_injection/requirements.txt
          uv pip install --system -e ./packages/common -e ./packages/scanner -e ./packages/guardrail
          uv pip install --system pytest pytest-asyncio pytest-cov ruff onnx onnxruntime skl2onnx

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=mcp_security_common --cov=mcp_scanner --cov=mcp_guardrail --cov-report=term-missing --cov-report=xml --cov-fail-under=90
